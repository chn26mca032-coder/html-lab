<!DOCTYPE html>
<html>
<head>
<title>Student Forms</title>
<style>
body {
font-family: Arial;
}
.container {
width: 700px;
margin: 20px auto;
}
.field {
margin-bottom: 12px;
}
input, select, textarea {
padding: 6px;
margin-top: 4px;
}
input[type="text"],
input[type="tel"],
input[type="date"],
input[type="password"],
select,
textarea {
width: 250px;
}
textarea {
height: 60px;
}
.row {
display: flex;
gap: 30px;
}
.buttons {
margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>Student Registration</h1>
<p>Welcome! Please fill in your details to complete your registration.</p>
</div>
<form action="#" method="post">
<div class="section">
<h2>Personal Information</h2>
<div class="row">
<div class="field">
<label for="fname">First Name</label><br>
<input type="text" id="fname" name="fname" placeholder="Enter first name" required>
</div>
<div class="field">
<label for="lname">Last Name</label><br>
<input type="text" id="lname" name="lname" placeholder="Enter last name" required>
</div>
</div>
<div class="row">
<div class="field">
<label for="dob">Date of Birth</label><br>
<input type="date" id="dob" name="dob" required>
</div>
<div class="field">
<label for="phone">Phone Number</label><br>
<input type="tel" id="phone" name="phone" placeholder="Enter mobile number" minlength="10" maxlength="10" pattern="[0-9]{10}" required>
</div>
</div>
<div class="field">
<label>Gender</label><br>
<label>
<input type="radio" name="gender" value="male">
Male
</label>
<label>
<input type="radio" name="gender" value="female">
Female
</label>
<label>
<input type="radio" name="gender" value="other">
Other
</label>
</div>
<div class="field">
<label for="address"><b>Address:</b></label><br>
<textarea id="address" name="address"></textarea>
</div>
<div class="row">
<div class="field">
<label for="nationality">Nationality</label><br>
<input type="text" id="nationality" name="nationality" placeholder="Enter nationality">
</div>
<div class="field">
<label for="qualification">Educational Qualification</label><br>
<select id="qualification" name="qualification">
<option value="">-- Select --</option>
<option value="bca">BCA</option>
<option value="btech">B.Tech</option>
<option value="mca">MCA</option>
<option value="mtech">M.Tech</option>
</select>
</div>
</div>
<div class="field">
<label for="bloodgroup">Blood Group</label><br>
<select id="bloodgroup" name="bloodgroup">
<option value="">-- Select --</option>
<option>A+</option>
<option>A-</option>
<option>B+</option>
<option>B-</option>
<option>O+</option>
<option>O-</option>
<option>AB+</option>
<option>Bombay Group</option>
</select>
</div>
<div class="field">
<label for="password">Password:</label><br>
<input type="password" id="password" name="password" placeholder="Enter password" required>
</div>
<div class="field">
<label for="confirm-password">Confirm Password:</label><br>
<input type="password" id="confirm-password" name="confirm_password" placeholder="Enter password" required>
</div>
<div class="buttons">
<input type="submit" value="SUBMIT">
<input type="reset" value="RESET">
</div>
</div>
</form>
</div>
</body>
</html>
