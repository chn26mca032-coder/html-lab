<!DOCTYPE html>
<html>
<head>
    <title>Web Page with Two Frames</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
        }

        h1 {
            background-color: #2e7d32;
            color: white;
            padding: 20px;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            border: 1px solid #4caf50;
            padding: 15px;
        }

        td:first-child {
            width: 25%;
            background-color: #c8e6c9;
            vertical-align: top;
        }

        a {
            display: block;
            text-decoration: none;
            color: #1b5e20;
            background-color: white;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }

        a:hover {
            background-color: #4caf50;
            color: white;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid #4caf50;
            background-color: white;
        }
    </style>
</head>

<body>

    <h1 align="center">Nature Items</h1>

    <table>
        <tr>
            <td>
                <a href="fruits.html" target="right">Fruits</a>
                <a href="vegetables.html" target="right">Vegetables</a>
                <a href="flowers.html" target="right">Flowers</a>
                <a href="trees.html" target="right">Trees</a>
            </td>

            <td>
                <iframe name="right"></iframe>
            </td>
        </tr>
    </table>

</body>
</html>
